<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova — Airport Operations</title>
<style>
  :root {
    color-scheme: dark;
    --bp:   #6fd0ff;
    --ok:   #6fd0ff;
    --warn: #ffc22e;
    --crit: #ff3b2e;
    --ink:  #dceeff;
    --mute: #6d8bb0;
    --line: rgba(111,208,255,.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#03070c;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }

  body::before {
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(58% 52% at 50% 48%, rgba(24,92,140,.30) 0%, rgba(3,7,12,0) 70%),
      radial-gradient(80% 70% at 50% 50%, rgba(8,26,44,.55) 0%, rgba(3,7,12,0) 78%);
  }
  canvas { position:fixed; inset:0; z-index:1; display:block; }

  /* ---------- alert hotspots ----------
     Only alerting systems get a marker. Labelling all ten buried the model in
     text; the point of a status view is that your eye lands on the exception. */
  #spots { position:fixed; inset:0; z-index:3; pointer-events:none; }

  .spot { position:absolute; transform:translate(-50%,-50%); pointer-events:auto;
          cursor:pointer; display:none; }
  .spot.show { display:block; }

  .spot .badge {
    position:relative; width:46px; height:46px; border-radius:50%;
    display:grid; place-items:center;
    background:rgba(236,244,255,.14);
    border:1px solid rgba(255,255,255,.30);
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    box-shadow:0 6px 22px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .2s cubic-bezier(.2,.8,.3,1), background .2s ease;
  }
  .spot:hover .badge { transform:scale(1.09); background:rgba(236,244,255,.22); }
  .spot .badge svg { width:21px; height:21px; display:block; }

  /* small affordance dot, bottom right */
  .spot .plus {
    position:absolute; right:-3px; bottom:-3px; width:17px; height:17px;
    border-radius:50%; display:grid; place-items:center;
    background:rgba(250,252,255,.92); color:#1a2634;
    font-size:12px; line-height:1; font-weight:500;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }

  .spot.warn .badge { background:rgba(255,205,60,.20); border-color:rgba(255,205,60,.55); }
  .spot.crit .badge { background:rgba(255,78,60,.20);  border-color:rgba(255,78,60,.60); }
  .spot.warn .badge svg { color:#ffd24a; }
  .spot.crit .badge svg { color:#ff6a5a; }
  .spot.sel  .badge { border-color:rgba(255,255,255,.85); }

  /* halo ring, so a critical marker is findable without reading anything */
  .spot .ring {
    position:absolute; inset:-4px; border-radius:50%; border:1px solid currentColor;
    opacity:0; pointer-events:none;
  }
  .spot.warn { color:#ffd24a; }
  .spot.crit { color:#ff6a5a; }
  .spot.warn .ring { animation:ping 2.6s cubic-bezier(.2,.7,.3,1) infinite; }
  .spot.crit .ring { animation:ping 1.4s cubic-bezier(.2,.7,.3,1) infinite; }
  @keyframes ping {
    0%   { transform:scale(1);   opacity:.8; }
    70%  { transform:scale(1.85); opacity:0; }
    100% { transform:scale(1.85); opacity:0; }
  }

  /* name appears on hover only — kept out of the way until asked for */
  .spot .tip {
    position:absolute; left:50%; top:calc(100% + 9px); transform:translateX(-50%);
    white-space:nowrap; padding:5px 10px; border-radius:99px;
    background:rgba(12,20,30,.86); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    opacity:0; transition:opacity .18s ease; pointer-events:none;
  }
  .spot:hover .tip, .spot.sel .tip { opacity:1; }
  .spot .tip .nm { font-size:10.5px; font-weight:600; }
  .spot .tip .pt { font-size:8.5px; letter-spacing:.12em; text-transform:uppercase;
                   color:var(--mute); margin-left:6px; }

  /* ---------- hand tracking ---------- */
  #handUI { position:fixed; left:26px; bottom:112px; z-index:6; width:132px; display:none; }
  #handUI.on { display:block; }
  #hwrap { position:relative; width:132px; height:99px; }
  #hvid { width:132px; height:99px; object-fit:cover; border:1px solid var(--line);
    transform:scaleX(-1); background:rgba(0,0,0,.45); display:block; }
  #hcanvas { position:absolute; inset:0; width:132px; height:99px; pointer-events:none; }
  #hstatus { font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--mute); margin-top:6px; text-align:center; line-height:1.4; }
  #hstatus.live { color:var(--bp); }
  #hstatus.grab { color:var(--warn); }
  #hstatus.err  { color:var(--crit); text-transform:none; letter-spacing:0; font-size:10px; }
  #hlegend { margin-top:8px; padding:8px 9px; border:1px solid var(--line);
    background:rgba(9,20,32,.6); font-size:9px; line-height:1.7; color:var(--mute); }
  #hlegend b { color:var(--ink); font-weight:500; display:inline-block; min-width:62px; }

  #hcursor { position:fixed; z-index:8; left:0; top:0; pointer-events:none; display:none;
    width:34px; height:34px; margin:-17px 0 0 -17px; transition:transform .08s ease; }
  #hcursor.on { display:block; }
  #hcursor span { display:block; width:100%; height:100%; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.7); box-shadow:0 0 14px rgba(111,208,255,.6); }
  #hcursor.pinch span { border-color:var(--warn); background:rgba(255,194,46,.18); }

  /* ---------- assistant ---------- */
  /* Floating and draggable. Position is set in px by the drag handler, so the
     panel and its collapsed button always share one coordinate. */
  #ai {
    position:fixed; left:26px; top:calc(100vh - 420px); z-index:7; width:306px;
    border:1px solid var(--line); border-radius:6px;
    background:rgba(9,20,32,.80);
    backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 18px 46px rgba(0,0,0,.5);
    flex-direction:column; overflow:hidden;
    display:none;                 /* the ONLY display declaration in this rule */
  }
  #ai.open { display:flex; }

  #aiHead {
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-bottom:1px solid var(--line); cursor:grab; user-select:none;
    font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute);
  }
  #aiHead { touch-action:none; }
  #aiHead.dragging { cursor:grabbing; }
  .brand {
    text-transform:none; letter-spacing:.01em; font-size:13px; font-weight:600;
    color:var(--ink); line-height:1;
  }
  .brand b {
    font-size:1.45em; font-weight:700; letter-spacing:-.02em;
    color:var(--bp); vertical-align:baseline;
  }

  .grip {
    width:8px; height:12px; flex:0 0 auto; opacity:.5;
    background-image:radial-gradient(circle, var(--mute) 1px, transparent 1px);
    background-size:4px 4px;
  }
  #aiMin {
    padding:2px 7px; cursor:pointer; font-family:inherit; font-size:12px; line-height:1;
    color:var(--mute); background:transparent; border:1px solid var(--line);
  }
  #aiMin:hover { color:var(--ink); border-color:var(--bp); }

  /* collapsed state — a floating button that carries the same position */
  #aiFab {
    position:fixed; left:26px; top:calc(100vh - 420px); z-index:7;
    width:52px; height:52px; border-radius:50%; display:none;
    place-items:center; cursor:grab;
    color:var(--bp); background:rgba(9,20,32,.82);
    border:1px solid rgba(111,208,255,.35);
    backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:transform .18s cubic-bezier(.2,.8,.3,1), border-color .18s ease;
  }
  #aiFab.show { display:grid; }
  #aiFab:hover { transform:scale(1.07); border-color:var(--bp); }
  #aiFab { touch-action:none; }
  #aiFab.dragging { cursor:grabbing; }
  #aiFab svg { width:22px; height:22px; pointer-events:none; }
  .fabdot { pointer-events:none; }
  .fabdot {
    position:absolute; right:2px; top:2px; width:9px; height:9px; border-radius:50%;
    background:transparent;
  }
  .fabdot.warn { background:var(--warn); box-shadow:0 0 9px var(--warn); }
  .fabdot.crit { background:var(--crit); box-shadow:0 0 9px var(--crit);
                 animation:blink 1.1s ease-in-out infinite; }
  .dotlive { width:6px; height:6px; border-radius:50%; background:var(--mute); flex:0 0 auto; }
  .dotlive.on { background:var(--crit); animation:blink 1.1s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  #aiMic {
    margin-left:auto; padding:4px 10px; cursor:pointer; font-family:inherit;
    font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--mute); background:transparent; border:1px solid var(--line);
  }
  #aiMic:hover { color:var(--ink); border-color:var(--bp); }
  #aiMic.on { color:#fff; background:rgba(255,59,46,.35); border-color:var(--crit); }

  #aiLog { max-height:230px; overflow-y:auto; padding:10px 12px; }
  #aiLog::-webkit-scrollbar { width:3px; }
  #aiLog::-webkit-scrollbar-thumb { background:rgba(111,208,255,.2); }
  .msg { margin-bottom:9px; font-size:11.5px; line-height:1.5; }
  .msg .who { font-size:8.5px; letter-spacing:.14em; text-transform:uppercase;
              color:var(--mute); display:block; margin-bottom:2px; }
  .msg.you .body { color:#a9c6e2; }
  .msg.ai  .body { color:var(--ink); }
  .msg.ai.alert .body { color:#ffd9a8; }
  .msg .body b { color:#fff; font-weight:600; }

  #aiBar { display:flex; border-top:1px solid var(--line); }
  #aiText {
    flex:1; padding:9px 12px; background:transparent; border:none; outline:none;
    color:var(--ink); font-family:inherit; font-size:11.5px;
  }
  #aiText::placeholder { color:rgba(109,139,176,.7); }
  #aiSend {
    padding:0 13px; cursor:pointer; font-family:inherit; font-size:9.5px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--mute);
    background:transparent; border:none; border-left:1px solid var(--line);
  }
  #aiSend:hover { color:var(--ink); }

  @media (max-width:900px) { #ai { display:none; } }

  /* ---------- title / legend ---------- */
  #title { position:fixed; left:26px; top:24px; z-index:4; pointer-events:none; }
  #title h1 { font-size:13px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
  .brand-lg {
    text-transform:none !important; letter-spacing:.005em !important;
    font-size:26px !important; font-weight:600; color:var(--ink); line-height:1;
  }
  .brand-lg b {
    font-size:1.42em; font-weight:700; letter-spacing:-.03em; color:var(--bp);
  }
  #title p  { font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
              color:var(--mute); margin-top:5px; }

  #legend { position:fixed; left:26px; bottom:24px; z-index:4;
    border:1px solid var(--line); padding:11px 13px; background:rgba(9,24,40,.6);
    backdrop-filter:blur(10px); font-size:9.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--mute); }
  #legend div { display:flex; align-items:center; gap:8px; padding:2px 0; }
  #legend i { width:14px; height:2px; display:block; }

  /* ---------- card ---------- */
  #card { position:fixed; right:26px; top:50%; z-index:5; width:264px;
    transform:translateY(-50%) translateX(16px); opacity:0; pointer-events:none;
    transition:opacity .26s ease, transform .26s cubic-bezier(.2,.8,.3,1);
    background:rgba(9,24,40,.72); border:1px solid var(--line);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    box-shadow:0 20px 50px rgba(0,0,0,.5); }
  #card.open { opacity:1; transform:translateY(-50%) translateX(0); pointer-events:auto; }
  .pad { padding:16px; }
  .head { display:flex; align-items:center; gap:10px; }
  .head .t { font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); }
  #close { margin-left:auto; width:20px; height:20px; border:1px solid var(--line);
    background:transparent; color:var(--mute); cursor:pointer; font-size:12px; line-height:1; }
  #close:hover { color:var(--ink); border-color:var(--bp); }
  .phrase { font-size:16px; font-weight:500; line-height:1.34; margin-top:11px; }
  .partname { font-size:9px; letter-spacing:.14em; text-transform:uppercase;
              color:var(--bp); margin-top:8px; opacity:.85; }
  .hero { margin-top:18px; }
  .hero .hk { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
  .hero .hv { font-size:32px; font-weight:600; letter-spacing:-.035em; margin-top:2px; }
  .gauge { height:3px; background:rgba(111,208,255,.14); margin-top:10px; }
  .gauge i { display:block; height:100%; background:var(--ok); transition:width .5s ease; }
  #card.warn .gauge i { background:var(--warn); }
  #card.crit .gauge i { background:var(--crit); }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:14px; }
  .tile { border:1px solid var(--line); padding:9px 10px 7px; }
  .tile .k { font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
  .tile .v { font-size:16px; font-weight:600; letter-spacing:-.02em; margin-top:1px; }
  .tile svg { display:block; width:100%; height:24px; margin-top:5px; overflow:visible; }
  .foot { font-size:10.5px; color:var(--mute); margin-top:13px; padding-top:11px;
          border-top:1px solid var(--line); }
  .foot b { font-weight:500; color:var(--ink); }
  #card.warn .foot b { color:var(--warn); }
  #card.crit .foot b { color:var(--crit); }

  /* ---------- controls ---------- */
  #foot { position:fixed; left:0; right:0; bottom:24px; z-index:4; text-align:center;
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:rgba(109,139,176,.8); pointer-events:none; }
  #foot button { pointer-events:auto; margin-left:8px; padding:5px 11px; cursor:pointer;
    font-family:inherit; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--mute); background:transparent; border:1px solid var(--line); }
  #foot button:hover { color:var(--ink); border-color:var(--bp); }
  #foot button.on { color:var(--bp); border-color:var(--bp); }

  @media (max-width:900px) { #card { right:14px; width:246px; } #legend { display:none; } }
</style>
<style id="nv-clean">
.nv-mark{position:static!important;display:inline-block!important;flex:none;width:1.45em;height:1.45em;opacity:1!important;transform:none!important;vertical-align:middle}
.nv-logo{display:inline-flex!important;align-items:center;gap:.5em;white-space:nowrap}
.partner-badge,.partner,[class*="partner-badge"]{display:none!important}
.concept-note{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483000;font:500 11px/1.2 system-ui,sans-serif;letter-spacing:.02em;padding:7px 12px;border-radius:999px;background:rgba(12,12,18,.72);color:#fff;backdrop-filter:blur(8px);pointer-events:none}
</style></head>
<body>

<div id="title">
  <h1 class="brand-lg nv-logo"><svg class="nv-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="nvgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c9bff"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#nvgrad)"/><path d="M10 22V10l12 12V10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Nova</h1>
  <p>Airport operations · Engine assembly · Live status</p>
</div>

<div id="spots"></div>

<button id="aiFab" title="Nova — drag to move">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3a4 4 0 014 4v4a4 4 0 01-8 0V7a4 4 0 014-4zM5 11a7 7 0 0014 0M12 18v3"/>
  </svg>
  <span class="fabdot" id="aiFabDot"></span>
</button>

<div id="ai">
  <div id="aiHead">
    <span class="grip"></span>
    <span class="dotlive" id="aiDot"></span>
    <span class="brand">Nova</span>
    <button id="aiMic" title="Hold to talk">Speak</button>
    <button id="aiMin" title="Minimise">&minus;</button>
  </div>
  <div id="aiLog"></div>
  <div id="aiBar">
    <input id="aiText" type="text" autocomplete="off" placeholder="Which department is not working well?">
    <button id="aiSend">Ask</button>
  </div>
</div>

<div id="handUI">
  <div id="hwrap">
    <video id="hvid" playsinline muted></video>
    <canvas id="hcanvas" width="132" height="99"></canvas>
  </div>
  <div id="hstatus">camera off</div>
  <div id="hlegend">
    <div><b>pinch + move</b> orbit</div>
    <div><b>quick pinch</b> select</div>
    <div><b>two pinches</b> zoom</div>
    <div><b>open palm</b> spin on/off</div>
    <div><b>fist</b> reset</div>
  </div>
</div>
<div id="hcursor"><span></span></div>

<div id="legend">
  <div><i style="background:var(--ok)"></i> Nominal</div>
  <div><i style="background:var(--warn)"></i> Warning</div>
  <div><i style="background:var(--crit)"></i> Critical</div>
</div>

<div id="card">
  <div class="pad">
    <div class="head">
      <div class="t" id="cTitle"></div>
      <button id="close" aria-label="Close">&times;</button>
    </div>
    <div class="phrase" id="cPhrase"></div>
    <div class="partname" id="cPart"></div>
    <div class="hero">
      <div class="hk" id="cHeroK"></div>
      <div class="hv" id="cHeroV"></div>
      <div class="gauge"><i id="cGauge"></i></div>
    </div>
    <div class="tiles" id="cTiles"></div>
    <div class="foot" id="cFoot"></div>
  </div>
</div>

<div id="foot">Drag to orbit · click a system for detail<button id="handBtn">hand control</button><button id="cover">cover</button><button id="explode">dismantle</button><button id="sim">simulate</button><button id="reset">reset view</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const STATE = { OK:'ok', WARN:'warn', CRIT:'crit' };
  const HEX = { ok:0x6fd0ff, warn:0xffc22e, crit:0xff2200 };
  const CSS = { ok:'#6fd0ff', warn:'#ffc22e', crit:'#ff3b2e' };

  /* ================= departments → engine systems ================= */
  const DEPTS = [
    { id:'pax', name:'Passenger Services', part:'Intake fan', state:STATE.OK,
      phrase:'Queues under five minutes', hero:['4.1m','Queue time'], health:93,
      tiles:[['Desks open','18',[12,14,15,16,17,18,18]],['Screening','312/hr',[260,275,288,296,304,309,312]]],
      alerts:[], anchor:[-4.4, 2.9, 0] },

    { id:'cargo', name:'Cargo', part:'Bypass duct', state:STATE.OK,
      phrase:'Load factor holding high', hero:['94%','Load factor'], health:94,
      tiles:[['Handled','128 t',[96,104,110,108,119,124,128]],['Damage','1.4%',[2.2,2.0,1.9,1.7,1.6,1.5,1.4]]],
      alerts:[], anchor:[-1.6, 2.55, 0] },

    { id:'bhs', name:'Baggage Handling', part:'LP compressor', state:STATE.WARN,
      phrase:'Backlog building on T2', hero:['82%','Throughput'], health:82,
      tiles:[['Belt latency','4.2m',[1.8,2.0,2.4,3.1,3.4,3.9,4.2]],['Mishandled','7',[1,2,2,3,4,6,7]]],
      alerts:[['warn','Carousel 4 below rated speed','18 min ago'],
              ['warn','Transfer backlog above threshold','44 min ago']],
      anchor:[-3.0, -1.5, 0] },

    { id:'ramp', name:'Ground Handling', part:'HP compressor', state:STATE.OK,
      phrase:'Turnarounds on target', hero:['12m','Avg turnaround'], health:93,
      tiles:[['Crews out','9',[7,8,8,9,9,9,9]],['Pushbacks','23',[17,19,20,21,22,23,23]]],
      alerts:[], anchor:[-1.4, -1.25, 0] },

    { id:'cater', name:'Catering', part:'Fuel manifold', state:STATE.OK,
      phrase:'Cold chain in range', hero:['96%','Uplift on time'], health:96,
      tiles:[['Cold chain','1.8°C',[2.4,2.3,2.1,2.0,1.9,1.9,1.8]],['Carts late','0',[3,2,2,1,1,0,0]]],
      alerts:[], anchor:[-0.1, 1.85, 0] },

    { id:'aocc', name:'Operations Control', part:'Combustor core', state:STATE.OK,
      phrase:'Shared picture is current', hero:['100%','Feeds live'], health:100,
      tiles:[['Feeds','9',[6,7,7,8,8,9,9]],['Latency','0.8s',[1.6,1.4,1.3,1.1,1.0,0.9,0.8]]],
      alerts:[], anchor:[0.5, -1.35, 0] },

    { id:'eng', name:'Engineering', part:'HP turbine', state:STATE.CRIT,
      phrase:'Three aircraft grounded', hero:['61%','Fleet ready'], health:61,
      tiles:[['Defects','9',[3,4,4,6,7,8,9]],['AOG','3',[0,0,1,1,2,2,3]]],
      alerts:[['crit','9H-LMR grounded — hydraulic fault','6 min ago'],
              ['crit','Stand 12 tug out of service','31 min ago']],
      anchor:[1.7, 1.5, 0] },

      tiles:[['Gates active','22',[18,19,20,21,22,22,22]],['Late board','1',[4,3,3,2,2,1,1]]],
      alerts:[], anchor:[3.0, -1.8, 0] },

    { id:'atc', name:'Air Traffic Control', part:'FADEC control unit', state:STATE.OK,
      phrase:'Movements running clean', hero:['41','Movements/hr'], health:96,

    { id:'fac', name:'Facilities & Safety', part:'Accessory gearbox', state:STATE.OK,
      phrase:'Infrastructure nominal', hero:['99%','Systems up'], health:99,
      tiles:[['Incidents','0',[2,1,1,0,0,0,0]],['ARFF ready','4',[3,4,4,4,4,4,4]]],
      alerts:[], anchor:[-0.4, -3.0, 0] },
  ];
  const D = {}; DEPTS.forEach(d => { D[d.id] = d; });

  /* ================= renderer ================= */
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.88;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 0, 16);

  const pivot = new THREE.Group(); scene.add(pivot);
  const engine = new THREE.Group(); pivot.add(engine);

  /* ================= materials =================
     Solid CAD cutaway, not x-ray. Every part shares ONE base colour, so the
     only colour information on screen is status: red for critical, yellow for
     warning. Nothing else competes for attention. */
  const BASE_C = 0x24384e;          // dark gunmetal blue
  const EDGE_C = 0x0a1622;          // dark outline, the way CAD renders read

  /* Micro-surface noise. A perfectly uniform roughness value is the single
     biggest tell that something is CG — real metal has tooling marks and
     wear, which break up the specular into something the eye trusts. */
  function noiseTex() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#8a8a8a'; x.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 9000; i++) {
      const v = 90 + Math.random() * 110;
      x.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',.5)';
      x.fillRect(Math.random() * 256, Math.random() * 256, 1.6, 1.6);
    }
    // faint circumferential banding, like a turned surface
    for (let i = 0; i < 90; i++) {
      x.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.05) + ')';
      x.fillRect(0, Math.random() * 256, 256, 1);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(3, 3);
    return t;
  }
  const NOISE = noiseTex();

  /* One colour, but not one finish. Blades are polished, casings are matte,
     fittings sit between — that variation is what stops it looking moulded
     out of a single block of plastic. */
  function solidMat(o) {
    o = o || {};
    return new THREE.MeshStandardMaterial({
      color: o.color || BASE_C,
      metalness: o.metal === undefined ? 0.55 : o.metal,
      roughness: o.rough === undefined ? 0.42 : o.rough,
      roughnessMap: NOISE,
      envMapIntensity: o.env === undefined ? 0.75 : o.env,
      emissive: 0x000000, emissiveIntensity: 0,
      side: THREE.DoubleSide,
    });
  }
  const glassMat = () => solidMat({ metal:0.48, rough:0.50, env:0.65 });   // casings, matte
  const bladeMat = () => solidMat({ metal:0.82, rough:0.24, env:0.95 });   // blades, polished
  const glowMat  = () => solidMat({ metal:0.70, rough:0.34, env:0.80 });   // fittings

  const haloVert = `varying vec3 vN; varying vec3 vP;
    void main(){ vN = normalize(normalMatrix*normal);
      vec4 mv = modelViewMatrix*vec4(position,1.0); vP = mv.xyz;
      gl_Position = projectionMatrix*mv; }`;
  const haloFrag = `uniform vec3 uColor; uniform float uI;
    varying vec3 vN; varying vec3 vP;
    void main(){ vec3 V = normalize(-vP);
      float f = 1.0 - abs(dot(normalize(vN), V));
      gl_FragColor = vec4(uColor, (pow(f,1.5) + pow(f,0.55)*0.35) * uI); }`;

  /* Casings are cut open at the top rather than drawn as full tubes.
     Local +Y maps to world up after the Z-rotation, so removing theta 45°-135°
     leaves the gap facing the camera-up direction. */
  const CUT_START = Math.PI * 0.75, CUT_LEN = Math.PI * 1.5;
  function casing(rTop, rBot, len, seg) {
    return new THREE.CylinderGeometry(rTop, rBot, len, seg || 72, 1, true, CUT_START, CUT_LEN);
  }

  /* Wireframe net for a cylindrical shell. WireframeGeometry would work but it
     draws every triangle diagonal, which looks like torn mesh — this builds
     clean hoops and ribs from the geometry's own parameters instead. */
  function netFromCylinder(pr, rings, ribs) {
    const rt = pr.radiusTop, rb = pr.radiusBottom, h = pr.height;
    const ts = pr.thetaStart || 0;
    const tl = pr.thetaLength === undefined ? Math.PI * 2 : pr.thetaLength;
    const pts = [], SEG = 60;
    const rAt = t => rt + (rb - rt) * t;

    for (let i = 0; i < rings; i++) {
      const t = rings === 1 ? 0.5 : i / (rings - 1);
      const y = h / 2 - h * t, r = rAt(t);
      for (let j = 0; j < SEG; j++) {
        const a0 = ts + tl * (j / SEG), a1 = ts + tl * ((j + 1) / SEG);
        pts.push(new THREE.Vector3(Math.sin(a0) * r, y, Math.cos(a0) * r));
        pts.push(new THREE.Vector3(Math.sin(a1) * r, y, Math.cos(a1) * r));
      }
    }
    for (let k = 0; k <= ribs; k++) {
      const a = ts + tl * (k / ribs);
      pts.push(new THREE.Vector3(Math.sin(a) * rt,  h / 2, Math.cos(a) * rt));
      pts.push(new THREE.Vector3(Math.sin(a) * rb, -h / 2, Math.cos(a) * rb));
    }
    return new THREE.BufferGeometry().setFromPoints(pts);
  }

  /* ================= part builder ================= */
  const SYS = {};

  function sys(id, spin) {
    const g = new THREE.Group();
    engine.add(g);
    SYS[id] = { group:g, bodies:[], edges:[], halos:[], spin: spin || 0, angle:0, rate:1 };
    return SYS[id];
  }

  // glass shell + always-on fresnel rim + edge wire
  function addShell(s, geom, pos, rot, opts) {
    const o = opts || {};
    /* Covers are drawn as an open net over a ghost surface. The surface is
       almost invisible but still raycasts, so the whole casing stays
       clickable — a bare wireframe is nearly impossible to hit. */
    const m = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
      color: BASE_C, metalness: 0.4, roughness: 0.5, roughnessMap: NOISE,
      envMapIntensity: 0.5, side: THREE.DoubleSide,
      transparent: true, opacity: 0.10, depthWrite: false,
      emissive: 0x000000, emissiveIntensity: 0,
    }));
    if (pos) m.position.set(pos[0], pos[1], pos[2]);
    if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
    m.userData.sys = s;
    s.group.add(m); s.bodies.push(m);

    const h = new THREE.Mesh(geom, new THREE.ShaderMaterial({
      uniforms:{ uColor:{value:new THREE.Color(0xff3b2e)}, uI:{value:0} },
      vertexShader:haloVert, fragmentShader:haloFrag,
      transparent:true, blending:THREE.AdditiveBlending,
      depthWrite:false, side:THREE.DoubleSide,
    }));
    if (pos) h.position.set(pos[0], pos[1], pos[2]);
    if (rot) h.rotation.set(rot[0], rot[1], rot[2]);
    h.userData.baseI = o.rim || 0.55;
    h.visible = false;   // only an alerting system glows
    s.group.add(h); s.halos.push(h);

    if (geom.type === 'CylinderGeometry' && !o.noNet) {
      const lines = new THREE.LineSegments(
        netFromCylinder(geom.parameters, o.rings || 4, o.ribs || 20),
        new THREE.LineBasicMaterial({ color: BASE_C, transparent: true, opacity: 0.7 }));
      if (pos) lines.position.set(pos[0], pos[1], pos[2]);
      if (rot) lines.rotation.set(rot[0], rot[1], rot[2]);
      s.group.add(lines); s.edges.push(lines);
    }
    return m;
  }

  // bright additive piece — hoops, plumbing, small detail
  function addGlow(s, geom, pos, rot, op) {
    const m = new THREE.Mesh(geom, glowMat());
    if (pos) m.position.set(pos[0], pos[1], pos[2]);
    if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
    m.userData.sys = s; m.userData.tint = true;
    s.group.add(m); s.bodies.push(m);
    return m;
  }

  /* Signature hoop: a bright thin ring plus a fatter, fainter one behind it.
     Two passes is a cheap stand-in for bloom, which needs a post chain we
     don't have here — and it reads almost the same at these line widths. */
  function hoop(s, x, r) {
    addGlow(s, new THREE.TorusGeometry(r, 0.03, 12, 96), [x,0,0], [0,Math.PI/2,0]);
  }

  function bladeRow(s, x, rIn, rOut, count, chord, stagger) {
    // taper + a touch of thickness so blades read as aerofoils, not slabs
    const geom = new THREE.BoxGeometry(chord, rOut - rIn, 0.05);
    const pos = geom.attributes.position;
    for (let v = 0; v < pos.count; v++) {
      const y = pos.getY(v);
      const tip = (y + (rOut - rIn) / 2) / (rOut - rIn);   // 0 root, 1 tip
      pos.setX(v, pos.getX(v) * (1 - tip * 0.35));
      pos.setZ(v, pos.getZ(v) * (1 - tip * 0.45));
    }
    geom.computeVertexNormals();
    for (let i = 0; i < count; i++) {
      const hub = new THREE.Group();
      hub.rotation.x = (i / count) * Math.PI * 2;
      const b = new THREE.Mesh(geom, bladeMat());
      b.position.set(x, (rIn + rOut) / 2, 0);
      b.rotation.y = stagger;
      b.userData.sys = s; b.userData.tint = true;
      hub.add(b);
      s.group.add(hub);
      s.bodies.push(b);
    }
    hoop(s, x, rIn);   // hub ring only — an outer ring per row stacked into a mesh
  }

  /* ---------- PASSENGER SERVICES — intake fan ---------- */
  {
    const s = sys('pax', 1.0);

    // enclosed the engine in a net; a single vane ring states the same thing.
    for (let i = 0; i < 18; i++) {

    addShell(s, new THREE.ConeGeometry(0.52, 1.3, 48), [5.05,0,0], [0,0,-Math.PI/2], { rim:0.8 });

    // Just the housing and its drive shaft. The gear rings and plumbing runs
    // read as scattered specks at this scale rather than as detail.
    addGlow(s, new THREE.CylinderGeometry(0.05, 0.05, 1.1, 8), [-0.4, -2.0, 0]);
  }

  /* ================= rotation rate =================

  const RATE = { ok:1.0, warn:0.28, crit:0.0 };

  const EXPLODE = {
    pax:   [-4.2,  0,    0],
    bhs:   [-2.6,  0,    0],
    cargo: [-3.4,  0,    0],     // stays on axis, landing just aft of the fan
    ramp:  [-1.1,  0,    0],
    cater: [-0.3,  0,    0],     // stays on the axis with the rest of the row
    aocc:  [ 1.0,  0,    0],
    eng:   [ 2.6,  0,    0],
    gate:  [ 4.4,  0,    0],
    atc:   [ 0,    2.2,  0],
    fac:   [ 0,   -2.2,  0],
  };
  const SHELL_EXPLODE = [0, 6.4, 0];

  /* ---------- static structure ---------- */
  const shell = new THREE.Group(); engine.add(shell);

  /* Outer nacelle, restored as glass. Opacity is low and depthWrite is off so
     it never occludes the core — it reads as an enclosing volume rather than a
     surface. The fresnel rim is what actually describes its shape; a flat
     transparent tube with no rim reads as fog. */
  const nacelleGeo = new THREE.CylinderGeometry(3.05, 2.5, 8.0, 56, 1, true);

  // Cowl as an open net. A transparent surface still reads as a wall no matter
  // how low the opacity goes — removing the surface entirely is what makes it

  const nacelleNet = new THREE.LineSegments(
    netFromCylinder(nacelleGeo.parameters, 9, 28),
    new THREE.LineBasicMaterial({ color: 0x7fa8cc, transparent: true, opacity: 0.42 }));
  nacelleNet.rotation.z = Math.PI / 2; nacelleNet.position.x = -1.1;
  shell.add(nacelleNet);

  // solid lip rings give the cowl its intake and exhaust edges
  [[-5.05, 3.00], [2.55, 2.54]].forEach(([x, r]) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.07, 16, 120), solidMat());
    ring.position.x = x; ring.rotation.y = Math.PI / 2;
    shell.add(ring);
  });

  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.15, 9.6, 32),
    solidMat());
  shaft.rotation.z = Math.PI/2; shaft.position.x = -0.3;
  engine.add(shaft);

  const cl = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-7.5,0,0), new THREE.Vector3(7.5,0,0)]),
    new THREE.LineDashedMaterial({ color:0x6fd0ff, dashSize:0.45, gapSize:0.22,
      transparent:true, opacity:0.20 }));
  cl.computeLineDistances();
  engine.add(cl);

  /* ================= lights ================= */
  scene.add(new THREE.AmbientLight(0x1a2838, 0.42));
  const k1 = new THREE.DirectionalLight(0xdfeaff, 1.0); k1.position.set(6, 9, 7);
  k1.castShadow = true;
  k1.shadow.mapSize.set(2048, 2048);
  k1.shadow.camera.near = 1; k1.shadow.camera.far = 42;

  k1.shadow.camera.top = 11;   k1.shadow.camera.bottom = -11;
  k1.shadow.bias = -0.0012; k1.shadow.normalBias = 0.02;
  scene.add(k1);
  const k2 = new THREE.DirectionalLight(0xffd9a8, 0.32); k2.position.set(-7, -3, 3); scene.add(k2);
  // backlight — separates the silhouette from the background, which is most
  // of what makes a dark product render read as "finished"
  const k3 = new THREE.DirectionalLight(0x8fc6ff, 1.15); k3.position.set(-3, 2, -9); scene.add(k3);
  const k4 = new THREE.PointLight(0x6f9fd0, 9, 30, 2); k4.position.set(0, -4, 2); scene.add(k4);

  /* Shadow catcher. ShadowMaterial draws nothing but the shadow itself, so the
     object gets contact with a surface without a visible floor appearing. */
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.ShadowMaterial({ opacity: 0.42 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -4.6;
  ground.receiveShadow = true;
  scene.add(ground);

  /* soft studio environment so the metal has something to reflect */
  (function () {
    const c = document.createElement('canvas'); c.width = 512; c.height = 256;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0.00, '#0f2036');
    g.addColorStop(0.42, '#5d7fa6');
    g.addColorStop(0.52, '#5f7d9e');
    g.addColorStop(1.00, '#0a1420');
    x.fillStyle = g; x.fillRect(0, 0, 512, 256);
    const b = x.createRadialGradient(360, 60, 0, 360, 60, 150);
    b.addColorStop(0, 'rgba(255,255,255,.38)'); b.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = b; x.fillRect(210, 0, 300, 210);
    const t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.encoding = THREE.sRGBEncoding;
    const pm = new THREE.PMREMGenerator(renderer);
    pm.compileEquirectangularShader();
    scene.environment = pm.fromEquirectangular(t).texture;
    pm.dispose(); t.dispose();
  })();

  /* ================= labels ================= */
  const spotsEl = document.getElementById('spots');
  let selected = null;

  // one glyph per department, drawn as simple strokes so they stay legible at 21px
  const ICONS = {
    pax:  '<path d="M12 3a3 3 0 110 6 3 3 0 010-6zM5 21v-2a7 7 0 0114 0v2"/>',
    cargo:'<path d="M3 8l9-5 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8"/>',
    bhs:  '<path d="M4 8h16v12H4zM9 8V5h6v3M9 12v4M15 12v4"/>',

    cater:'<path d="M5 4h11v7a5 5 0 01-10 0zM16 6h3a2 2 0 010 4h-3M4 21h14"/>',
    aocc: '<path d="M3 4h18v12H3zM9 20h6M12 16v4M7 11l3-3 2 2 4-4"/>',
    eng:  '<path d="M15 3a5 5 0 00-4.6 7L3 17.4 6.6 21l7.4-7.4A5 5 0 1015 3z"/>',
    gate: '<path d="M3 15l18-6-3-4-5 2-6-4-2 1 3 5-4 1z"/>',
    atc:  '<path d="M12 3v18M8 7l4-4 4 4M5 12a9 9 0 0114 0M8 15a5 5 0 018 0"/>',
    fac:  '<path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/>',
  };

  const spotEls = DEPTS.map(d => {
    const el = document.createElement('div');
    el.className = 'spot';
    el.innerHTML =
      '<div class="badge"><span class="ring"></span>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + (ICONS[d.id] || '') + '</svg>' +
      '<span class="plus">+</span></div>' +
      '<div class="tip"><span class="nm">' + d.name + '</span>' +
      '<span class="pt">' + d.part + '</span></div>';
    el.addEventListener('click', e => { e.stopPropagation(); select(d.id); });
    spotsEl.appendChild(el);
    return el;
  });

  /* ================= state ================= */
  // Optional hook so later features can react to a state change. It is a
  // mutable binding declared BEFORE paint runs — calling a hoisted function
  // that closes over a not-yet-initialised const throws on the first paint.
  let onPaint = null;

  function paint() {
    DEPTS.forEach((d, i) => {
      const s = SYS[d.id];
      const alerting = d.state !== STATE.OK;
      const col = alerting ? HEX[d.state] : BASE_C;

      s.edges.forEach(e => {
        e.material.color.setHex(col);
        e.material.opacity = alerting ? 0.95 : 0.7;
      });
      // The whole system takes the status colour as its body colour — a solid
      // tinted mass reads instantly, where an outline or rim needs looking for.
      s.bodies.forEach(b => {
        b.material.color.setHex(col);
        // ghost cover surfaces lift slightly when alerting, so the tinted net
        // has something behind it, but never become opaque panels
        if (b.material.depthWrite === false && b.material.transparent) {
          b.material.opacity = alerting ? 0.20 : 0.10;
        }
        if (b.material.emissive) b.material.emissive.setHex(alerting ? col : 0x000000);
        b.material.metalness = alerting ? 0.35 : (b.userData.baseMetal !== undefined
          ? b.userData.baseMetal : b.material.metalness);
        b.material.roughness = alerting ? 0.42 : (b.userData.baseRough !== undefined
          ? b.userData.baseRough : b.material.roughness);
      });
      s.halos.forEach(h => { h.visible = alerting; h.material.uniforms.uColor.value.setHex(col); });

      // the badge is the exception report: alerting systems, plus whatever
      // is currently open so the card always has a visible anchor
      const show = alerting || selected === d.id;
      spotEls[i].className = 'spot' + (show ? ' show' : '') +
                             (alerting ? ' ' + d.state : '') +
                             (selected === d.id ? ' sel' : '');
    });
    if (onPaint) onPaint();
  }

  const STROKE = CSS;

  function spark(vals, color) {
    const w = 100, h = 24;
    const min = Math.min(...vals), max = Math.max(...vals), r = (max - min) || 1;
    const pts = vals.map((v, i) => [
      (i / (vals.length - 1)) * w, h - 3 - ((v - min) / r) * (h - 8)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<path d="' + line + ' L' + w + ' ' + h + ' L0 ' + h + ' Z" fill="' + color + '" opacity=".12"/>' +
      '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.6" ' +
      'stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2" fill="' + color + '"/>' +
      '</svg>';
  }

  const cardEl = document.getElementById('card');

  function select(id) {
    const d = D[id];
    selected = id;
    const col = STROKE[d.state];
    cardEl.className = 'open ' + (d.state === STATE.OK ? '' : d.state);
    document.getElementById('cTitle').textContent = d.name;
    document.getElementById('cPhrase').textContent = d.phrase;
    document.getElementById('cPart').textContent = d.part;
    document.getElementById('cHeroV').textContent = d.hero[0];
    document.getElementById('cHeroK').textContent = d.hero[1];
    document.getElementById('cGauge').style.width = d.health + '%';
    document.getElementById('cTiles').innerHTML = d.tiles.map(t =>
      '<div class="tile"><div class="k">' + t[0] + '</div><div class="v">' + t[1] + '</div>' +
      spark(t[2], col) + '</div>').join('');
    document.getElementById('cFoot').innerHTML = d.alerts.length
      ? '<b>' + d.alerts.length + ' active</b> · ' + d.alerts[0][2]
      : 'No active alerts';
    paint();
  }

  function deselect() { selected = null; cardEl.className = ''; paint(); }
  document.getElementById('close').addEventListener('click', deselect);
  addEventListener('keydown', e => { if (e.key === 'Escape') deselect(); });

  /* ================= drag to orbit ================= */
  const cv = renderer.domElement;
  cv.style.cursor = 'grab';
  cv.style.touchAction = 'none';

  const userQuat = new THREE.Quaternion();
  const AX_X = new THREE.Vector3(1,0,0), AX_Y = new THREE.Vector3(0,1,0);
  const dq = new THREE.Quaternion();
  const SENS = 0.006, DECAY = 0.94;

  let hovering = false, dragging = false, moved = 0;
  let lastX = 0, lastY = 0, velX = 0, velY = 0;
  let targetZ = 16, resetting = false, spinLocked = false;

  function turn(rx, ry) {
    dq.setFromAxisAngle(AX_Y, rx); userQuat.premultiply(dq);
    dq.setFromAxisAngle(AX_X, ry); userQuat.premultiply(dq);
  }

  cv.addEventListener('pointerenter', () => { hovering = true; });
  cv.addEventListener('pointerleave', () => { hovering = false; });
  cv.addEventListener('pointerdown', e => {
    dragging = true; hovering = true; moved = 0;
    lastX = e.clientX; lastY = e.clientY; velX = velY = 0;
    cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing';
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    velX = (e.clientX - lastX) * SENS;
    velY = (e.clientY - lastY) * SENS;
    moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    turn(velX, velY);
  });

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  function release(e) {
    if (!dragging) return;
    dragging = false; cv.style.cursor = 'grab';
    if (e && e.pointerId !== undefined && cv.hasPointerCapture(e.pointerId))
      cv.releasePointerCapture(e.pointerId);
    if (moved < 6) {
      ndc.x = (e.clientX / innerWidth) * 2 - 1;
      ndc.y = -(e.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(engine.children, true)
        .find(h => h.object.userData && h.object.userData.sys);
      if (hit) {
        const id = Object.keys(SYS).find(k => SYS[k] === hit.object.userData.sys);
        if (id) select(id); else deselect();
      } else deselect();
    }
  }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  // scroll to zoom
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    targetZ = Math.max(7, Math.min(28, targetZ + e.deltaY * 0.012));
  }, { passive:false });

  /* ================= controls ================= */
  function resetView() {
    resetting = true; targetZ = 16; velX = velY = 0;
  }
  document.getElementById('reset').addEventListener('click', resetView);
  cv.addEventListener('dblclick', resetView);

  document.getElementById('sim').addEventListener('click', () => {
    DEPTS.forEach(d => { d.state = STATE.OK; });
    const pick = () => Math.floor(Math.random() * DEPTS.length);
    let a = pick(), b = pick();
    while (b === a) b = pick();
    DEPTS[a].state = STATE.CRIT;
    DEPTS[b].state = STATE.WARN;
    if (selected) select(selected); else paint();
  });

  // cover: glass cowl on by default, toggled off for an unobstructed core
  let coverOn = true;
  const coverBtn = document.getElementById('cover');
  coverBtn.classList.add('on');
  coverBtn.addEventListener('click', () => {
    coverOn = !coverOn;
    shell.visible = coverOn;
    coverBtn.classList.toggle('on', coverOn);
  });

  // dismantle: pull every system clear of the assembly
  let exploded = false, expT = 0;
  const expBtn = document.getElementById('explode');
  expBtn.addEventListener('click', () => {
    exploded = !exploded;
    expBtn.classList.toggle('on', exploded);
    expBtn.textContent = exploded ? 'assemble' : 'dismantle';
  });


  /* Shadow flags. The glass cowl is excluded — a transparent shell casting a
     hard shadow is a classic CG giveaway. */
  engine.traverse(o => {
    if (!o.isMesh) return;   // LineSegments skipped: wireframe shadows are noise
    const m = o.material;
    if (m && m.transparent && m.opacity < 0.3) return;
    o.castShadow = true;
    o.receiveShadow = true;
  });

  // snapshot the original finish per mesh, so clearing an alert restores the
  // polished-blade / matte-casing variation instead of flattening everything
  Object.keys(SYS).forEach(id => {
    SYS[id].bodies.forEach(b => {
      b.userData.baseMetal = b.material.metalness;
      b.userData.baseRough = b.material.roughness;
    });
  });

  paint();

  /* ================= ops assistant =================
     Answers come from the live DEPTS state, not from a language model — the
     question set here is narrow and factual, and a local resolver can't
     hallucinate a department that isn't failing. Speech in via the Web Speech
     API, speech out via speechSynthesis, and a text box for when neither is
     available. */
  const aiLog  = document.getElementById('aiLog');
  const aiText = document.getElementById('aiText');
  const aiMic  = document.getElementById('aiMic');
  const aiDot  = document.getElementById('aiDot');

  // every way a person might name each department out loud
  const ALIASES = {
    pax:   ['passenger', 'passengers', 'pax', 'check in', 'checkin', 'screening', 'immigration', 'fan'],
    cargo: ['cargo', 'freight', 'bypass'],
    bhs:   ['baggage', 'bags', 'bag', 'luggage', 'bhs', 'lp compressor', 'low pressure compressor'],
    ramp:  ['ground handling', 'ground', 'ramp', 'turnaround', 'hp compressor', 'high pressure compressor'],
    cater: ['catering', 'galley', 'food', 'fuel manifold'],
    aocc:  ['operations control', 'operations', 'control centre', 'control center', 'aocc', 'combustor', 'core'],
    eng:   ['engineering', 'maintenance', 'engineer', 'hp turbine', 'high pressure turbine'],
    gate:  ['gate', 'gates', 'boarding', 'lp turbine', 'low pressure turbine'],
    atc:   ['air traffic', 'atc', 'tower', 'traffic control', 'fadec'],
    fac:   ['facilities', 'facility', 'safety', 'security', 'police', 'emergency', 'arff', 'gearbox'],
  };

  const WORD = { ok:'nominal', warn:'a warning', crit:'critical' };

  function findDept(q) {
    for (const id in ALIASES) {
      if (ALIASES[id].some(a => q.includes(a))) return D[id];
    }
    return null;
  }

  function alerting() {
    return DEPTS.filter(d => d.state !== STATE.OK)
                .sort(a => a.state === STATE.CRIT ? -1 : 1);
  }

  function describe(d) {
    let out = d.name + ' is ' + WORD[d.state] + '. ' + d.phrase + '. ' +
              d.hero[1] + ' is ' + d.hero[0] + '.';
    if (d.alerts.length) {
      out += ' ' + d.alerts.length + ' active alert' + (d.alerts.length > 1 ? 's' : '') +
             ', the latest ' + d.alerts[0][2] + ': ' + d.alerts[0][1] + '.';
    }
    return out;
  }

  /* intent resolver — ordered most specific first */
  function answer(qRaw) {
    const q = qRaw.toLowerCase().trim();
    if (!q) return null;

    // control commands
    if (/\b(dismantle|explode|take apart|pull apart)\b/.test(q)) {
      if (!exploded) expBtn.click();
      return { text:'Dismantling the assembly.', act:null };
    }
    if (/\b(assemble|put back|reassemble)\b/.test(q)) {
      if (exploded) expBtn.click();
      return { text:'Reassembling.', act:null };
    }
    if (/\b(reset|recentre|recenter)\b/.test(q)) {
      resetView();
      return { text:'View reset.', act:null };
    }

    const d = findDept(q);

    // asked about one department
    if (d) {
      if (/\bwhy\b|\bwhat.s wrong\b|\bproblem\b|\breason\b/.test(q) && d.alerts.length) {
        return { text: d.name + ': ' + d.alerts.map(a => a[1]).join('; ') + '.', act:d.id };
      }
      return { text: describe(d), act:d.id };
    }

    // asked about the fleet as a whole
    const bad = alerting();

    if (/\bhow many\b|\bcount\b|\bnumber of\b/.test(q)) {
      return { text: bad.length === 0
        ? 'No departments are reporting issues.'
        : bad.length + ' of ' + DEPTS.length + ' departments are reporting issues.', act:null };
    }

    if (/\bcritical\b|\bworst\b|\bmost urgent\b|\bpriority\b/.test(q)) {
      const c = bad.filter(x => x.state === STATE.CRIT);
      if (!c.length) return { text:'Nothing is critical right now.', act:null };
      return { text: c.map(describe).join(' '), act:c[0].id };
    }

    if (/\bwarning\b|\bwarn\b/.test(q)) {
      const w = bad.filter(x => x.state === STATE.WARN);
      if (!w.length) return { text:'No warnings at the moment.', act:null };
      return { text: w.map(describe).join(' '), act:w[0].id };
    }

    if (/\bok\b|\bfine\b|\bnormal\b|\bhealthy\b|\bnominal\b|\bworking well\b/.test(q) &&
        /\bwhich\b|\bwhat\b|\bany\b/.test(q) && !/\bnot\b|\bn.t\b/.test(q)) {
      const good = DEPTS.filter(x => x.state === STATE.OK).map(x => x.name);
      return { text: good.length + ' departments are nominal: ' + good.join(', ') + '.', act:null };
    }

    // the default question: what needs attention
    if (bad.length === 0) {
      return { text:'All ' + DEPTS.length + ' departments are nominal. Nothing needs attention.', act:null };
    }
    const lead = bad.length === 1
      ? 'One department needs attention. '
      : bad.length + ' departments need attention. ';
    return { text: lead + bad.map(describe).join(' '), act: bad[0].id };
  }

  function addMsg(who, text, isAlert) {
    const el = document.createElement('div');
    el.className = 'msg ' + who + (isAlert ? ' alert' : '');
    el.innerHTML = '<span class="who">' + (who === 'you' ? 'You' : 'Assistant') +
                   '</span><span class="body">' + text + '</span>';
    aiLog.appendChild(el);
    aiLog.scrollTop = aiLog.scrollHeight;
  }

  let voices = [];
  function loadVoices() { voices = speechSynthesis.getVoices(); }
  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find(x => /en-GB|en_GB/.test(x.lang)) ||
              voices.find(x => /^en/.test(x.lang));
    if (v) u.voice = v;
    u.rate = 1.02; u.pitch = 1.0;
    speechSynthesis.speak(u);
  }

  function ask(q, spoken) {
    addMsg('you', q);
    const r = answer(q);
    if (!r) return;
    const bad = alerting().length > 0;
    addMsg('ai', r.text, bad);
    if (r.act) select(r.act);        // open the card for whatever it named
    if (spoken) speak(r.text);
  }

  document.getElementById('aiSend').addEventListener('click', () => {
    const q = aiText.value; aiText.value = '';
    if (q.trim()) ask(q, false);
  });
  aiText.addEventListener('keydown', e => {
    e.stopPropagation();             // Escape here shouldn't close the card
    if (e.key === 'Enter') { const q = aiText.value; aiText.value = ''; if (q.trim()) ask(q, true); }
  });

  /* ---------- speech in ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, listening = false;

  if (SR) {
    recog = new SR();
    recog.lang = 'en-GB';
    recog.interimResults = true;
    recog.continuous = false;

    recog.onstart = () => { listening = true; aiMic.classList.add('on');
                            aiDot.classList.add('on'); aiMic.textContent = 'Listening'; };
    recog.onend   = () => { listening = false; aiMic.classList.remove('on');
                            aiDot.classList.remove('on'); aiMic.textContent = 'Speak'; };
    recog.onerror = (e) => {
      addMsg('ai', e.error === 'not-allowed'
        ? 'Microphone permission denied. Type your question instead.'
        : 'Could not hear that — try again, or type it.');
    };
    recog.onresult = (e) => {
      let finalText = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else aiText.value = e.results[i][0].transcript;   // live interim in the box
      }
      if (finalText) { aiText.value = ''; ask(finalText.trim(), true); }
    };

    aiMic.addEventListener('click', () => {
      if (listening) { recog.stop(); return; }
      try { recog.start(); } catch (err) { /* already running */ }
    });
  } else {
    aiMic.disabled = true;
    aiMic.textContent = 'No mic';
    aiMic.title = 'Speech recognition needs Chrome or Edge';
  }


  /* ---------- floating + draggable ----------
     Panel and collapsed button share one position, so minimising never makes
     the widget jump. Drag distance decides click vs move, the same way the
     canvas separates a click from an orbit. */
  const aiPanel = document.getElementById('ai');
  const aiFab   = document.getElementById('aiFab');
  const aiHead  = document.getElementById('aiHead');
  const aiMin   = document.getElementById('aiMin');
  const aiFabDot = document.getElementById('aiFabDot');

  // starts collapsed in the bottom-right corner, clear of the footer controls
  const FAB_W = 52, FAB_MARGIN = 26, FOOT_CLEAR = 74;
  const wpos = { x: innerWidth - FAB_W - FAB_MARGIN,
                 y: innerHeight - FAB_W - FOOT_CLEAR };

  function placeWidget() {
    const open = aiPanel.classList.contains('open');
    const w = open ? 306 : FAB_W;
    const h = open ? (aiPanel.offsetHeight || 300) : FAB_W;
    wpos.x = Math.max(8, Math.min(innerWidth  - w - 8, wpos.x));
    wpos.y = Math.max(8, Math.min(innerHeight - h - 8, wpos.y));
    aiPanel.style.left = wpos.x + 'px'; aiPanel.style.top = wpos.y + 'px';
    aiFab.style.left   = wpos.x + 'px'; aiFab.style.top   = wpos.y + 'px';
  }

  function makeDraggable(handle, target) {
    let down = false, sx = 0, sy = 0, ox = 0, oy = 0, dist = 0;
    handle.addEventListener('pointerdown', e => {
      // Ignore presses on buttons INSIDE the handle (mic, minimise) — but when
      // the handle IS a button, as with the collapsed FAB, it must still drag.
      // The old check compared against e.target, which is the svg child on the
      // FAB, so every grab on the icon was discarded.
      const btn = e.target.closest('button');
      if (btn && btn !== handle) return;
      down = true; dist = 0;
      sx = e.clientX; sy = e.clientY; ox = wpos.x; oy = wpos.y;
      handle.setPointerCapture(e.pointerId);
      target.classList.add('dragging');
    });
    handle.addEventListener('pointermove', e => {
      if (!down) return;
      dist += Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy);
      wpos.x = ox + (e.clientX - sx);
      wpos.y = oy + (e.clientY - sy);
      placeWidget();
    });
    const end = e => {
      if (!down) return;
      down = false; target.classList.remove('dragging');
      if (handle.hasPointerCapture && handle.hasPointerCapture(e.pointerId))
        handle.releasePointerCapture(e.pointerId);
      handle.dataset.moved = dist > 6 ? '1' : '0';
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  makeDraggable(aiHead, aiPanel);
  makeDraggable(aiFab, aiFab);

  aiMin.addEventListener('click', e => {
    e.stopPropagation();
    aiPanel.classList.remove('open');
    aiFab.classList.add('show');
    placeWidget();
  });

  aiFab.addEventListener('click', () => {
    if (aiFab.dataset.moved === '1') return;   // that was a drag, not a tap
    aiPanel.classList.add('open');
    aiFab.classList.remove('show');
    placeWidget();
  });

  aiFab.classList.add('show');          // collapsed on load
  addEventListener('resize', placeWidget);
  placeWidget();

  // unread status shows on the collapsed button, so minimising doesn't hide alarms
  function paintFab() {
    const bad = alerting();
    const crit = bad.some(d => d.state === STATE.CRIT);
    aiFabDot.className = 'fabdot' + (crit ? ' crit' : bad.length ? ' warn' : '');
  }

  onPaint = paintFab;
  paintFab();

  addMsg('ai', '<b>Nova</b> online. Ask which departments need attention — by voice or text.');



  /* ================= hand tracking =================
     Pinch drives the same turn() and raycast as the mouse, so orbit, momentum
     and selection behave identically whichever input is used.
       pinch + move   → orbit
       quick pinch    → select the part under the cursor
       two pinches    → zoom by hand separation
       open palm      → freeze / resume the idle spin
       fist           → reset view
     getUserMedia needs a secure context: serve over localhost or https. */
  let handOn = false, handPresent = false, handPinch = false, handRuntime = null;
  let hx = 0, hy = 0, hLastX = 0, hLastY = 0, hMoved = 0;
  let zoomBase = null, zoomStartZ = 16, lastG = '';

  const hvid = document.getElementById('hvid');
  const hcur = document.getElementById('hcursor');
  const hstat = document.getElementById('hstatus');
  const handBtn = document.getElementById('handBtn');
  const handUI = document.getElementById('handUI');
  const hctx = document.getElementById('hcanvas').getContext('2d');

  const HAND_SENS = 0.010, PINCH_ON = 0.42, PINCH_OFF = 0.55;
  const HCON = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],
                [10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],
                [18,19],[19,20],[0,17]];

  function loadScript(src) {
    return new Promise((res, rej) => {
      const el = document.createElement('script');
      el.src = src; el.crossOrigin = 'anonymous';
      el.onload = res; el.onerror = () => rej(new Error('load failed'));
      document.head.appendChild(el);
    });
  }

  function drawHand(lm, lm2) {
    hctx.clearRect(0, 0, 132, 99);
    if (!lm) return;
    [lm, lm2].filter(Boolean).forEach(L => {
      const px = i => (1 - L[i].x) * 132, py = i => L[i].y * 99;
      hctx.strokeStyle = handPinch ? '#ffc22e' : '#6fd0ff';
      hctx.lineWidth = 1.4;
      hctx.beginPath();
      HCON.forEach(([a, b]) => { hctx.moveTo(px(a), py(a)); hctx.lineTo(px(b), py(b)); });
      hctx.stroke();
      hctx.fillStyle = handPinch ? '#ffc22e' : '#ffffff';
      [4, 8].forEach(i => { hctx.beginPath(); hctx.arc(px(i), py(i), 2.6, 0, Math.PI*2); hctx.fill(); });
    });
  }

  function clickAt(px, py) {
    ndc.x = (px / innerWidth) * 2 - 1;
    ndc.y = -(py / innerHeight) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(engine.children, true)
      .find(h => h.object.userData && h.object.userData.sys);
    if (hit) {
      const id = Object.keys(SYS).find(k => SYS[k] === hit.object.userData.sys);
      if (id) { select(id); return; }
    }
    deselect();
  }

  // rotation-independent: wrist→tip vs wrist→knuckle, not a y comparison
  function classify(lm) {
    const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
    const span = d(0, 9) || 1;
    const ext = [[8,6],[12,10],[16,14],[20,18]]
      .filter(([tip, pip]) => d(0, tip) > d(0, pip) * 1.12).length;
    return { ext, pinchRatio: d(4, 8) / span };
  }

  function onHand(res) {
    const hands = res.multiHandLandmarks || [];
    if (!hands.length) {
      if (handPinch) { handPinch = false; hcur.classList.remove('pinch'); }
      handPresent = false; zoomBase = null; lastG = '';
      hcur.classList.remove('on'); drawHand(null);
      hstat.textContent = 'no hand'; hstat.className = '';
      return;
    }
    handPresent = true;
    hcur.classList.add('on');
    const info = hands.map(classify);

    const tip = hands[0][8];
    hx += ((1 - tip.x) * innerWidth  - hx) * 0.35;
    hy += (tip.y * innerHeight - hy) * 0.35;
    hcur.style.transform = 'translate(' + hx + 'px,' + hy + 'px)' + (handPinch ? ' scale(.6)' : '');

    const twoPinch = hands.length === 2 &&
                     info[0].pinchRatio < PINCH_OFF && info[1].pinchRatio < PINCH_OFF;
    if (twoPinch) {
      const gap = Math.hypot(hands[0][8].x - hands[1][8].x, hands[0][8].y - hands[1][8].y);
      if (zoomBase === null) { zoomBase = gap; zoomStartZ = targetZ; }
      targetZ = Math.max(7, Math.min(28, zoomStartZ * (zoomBase / Math.max(gap, 0.02))));
      if (handPinch) { handPinch = false; hcur.classList.remove('pinch'); }
      hstat.textContent = 'zoom'; hstat.className = 'grab';
      drawHand(hands[0], hands[1]);
      return;
    }
    zoomBase = null;

    const p = info[0];
    let g = '';
    if (p.pinchRatio < PINCH_ON) g = 'pinch';
    else if (p.ext === 0) g = 'fist';
    else if (p.ext === 4) g = 'palm';

    if (g !== lastG) {                      // discrete poses fire once per change
      if (g === 'fist') resetView();
      if (g === 'palm') spinLocked = !spinLocked;
      lastG = g;
    }

    if (!handPinch && p.pinchRatio < PINCH_ON) {
      handPinch = true; hMoved = 0; hLastX = hx; hLastY = hy; velX = velY = 0;
      hcur.classList.add('pinch');
    } else if (handPinch && p.pinchRatio > PINCH_OFF) {
      handPinch = false; hcur.classList.remove('pinch');
      if (hMoved < 40) clickAt(hx, hy);
    }

    if (handPinch) {
      velX = (hx - hLastX) * HAND_SENS;
      velY = (hy - hLastY) * HAND_SENS;
      hMoved += Math.abs(hx - hLastX) + Math.abs(hy - hLastY);
      hLastX = hx; hLastY = hy;
      turn(velX, velY);
      hstat.textContent = 'orbit'; hstat.className = 'grab';
    } else if (g === 'fist') { hstat.textContent = 'reset'; hstat.className = 'grab'; }
    else if (g === 'palm')   { hstat.textContent = spinLocked ? 'spin off' : 'spin on';
                               hstat.className = 'live'; }
    else { hstat.textContent = 'tracking'; hstat.className = 'live'; }

    drawHand(hands[0], hands[1]);
  }

  async function enableHands() {
    if (!window.isSecureContext) throw new Error('Needs https or localhost — not file://');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error('Camera API unavailable here');

    hstat.textContent = 'requesting camera…'; hstat.className = '';
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
    } catch (e) {
      throw new Error(e.name === 'NotAllowedError' ? 'Camera permission denied' : 'No camera found');
    }
    hvid.srcObject = stream; await hvid.play();

    hstat.textContent = 'loading model…';
    const SOURCES = ['https://cdn.jsdelivr.net/npm/@mediapipe/hands/',
                     'https://unpkg.com/@mediapipe/hands/'];
    let base = null;
    for (const src of SOURCES) {
      try { await loadScript(src + 'hands.js'); base = src; break; } catch (e) { /* next */ }
    }
    if (!base || !window.Hands) throw new Error('Model blocked — check network/CSP');

    handRuntime = new window.Hands({ locateFile: f => base + f });
    handRuntime.setOptions({ maxNumHands: 2, modelComplexity: 0,
      minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    handRuntime.onResults(onHand);

    const pump = async () => {
      if (!handOn) return;
      if (hvid.readyState >= 2) {
        try { await handRuntime.send({ image: hvid }); } catch (e) { /* skip frame */ }
      }
      requestAnimationFrame(pump);
    };
    requestAnimationFrame(pump);
    hstat.textContent = 'tracking'; hstat.className = 'live';
  }

  handBtn.addEventListener('click', async () => {
    if (handOn) {
      handOn = false; handPresent = false; handPinch = false;
      if (hvid.srcObject) hvid.srcObject.getTracks().forEach(t => t.stop());
      hvid.srcObject = null; drawHand(null);
      handUI.classList.remove('on'); hcur.classList.remove('on');
      handBtn.classList.remove('on'); handBtn.textContent = 'hand control';
      return;
    }
    handOn = true;
    handUI.classList.add('on'); handBtn.classList.add('on');
    handBtn.textContent = 'hand off';
    try { await enableHands(); }
    catch (err) {
      handOn = false; handBtn.classList.remove('on'); handBtn.textContent = 'hand control';
      hstat.textContent = err.message; hstat.className = 'err';
      console.error('[hand tracking]', err);
    }
  });

  /* ================= loop ================= */
  const SPIN = 0.10;
  const isoQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.22, -0.5, 0.06));
  const spinQuat = new THREE.Quaternion(), wobQuat = new THREE.Quaternion();
  const wobEuler = new THREE.Euler(), IDENTITY = new THREE.Quaternion();
  const AX_Yw = new THREE.Vector3(0, 1, 0);
  const wp = new THREE.Vector3();

  let t = 0, prev = performance.now();

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;

    const idle = !hovering && !dragging && !handPresent && !spinLocked && selected === null;
    if (idle) t += dt;

    camera.position.z += (targetZ - camera.position.z) * 0.10;

    if (!dragging && !handPinch && (Math.abs(velX) > 1e-5 || Math.abs(velY) > 1e-5)) {
      velX *= DECAY; velY *= DECAY; turn(velX, velY);
    }
    if (resetting) {
      userQuat.slerp(IDENTITY, 0.08);
      if (userQuat.angleTo(IDENTITY) < 0.003) { userQuat.copy(IDENTITY); resetting = false; }
    }

    // ease toward the exploded or assembled state
    expT += ((exploded ? 1 : 0) - expT) * 0.07;
    Object.keys(SYS).forEach(id => {
      const off = EXPLODE[id];
      if (!off) return;
      SYS[id].group.position.set(off[0] * expT, off[1] * expT, off[2] * expT);
    });
    shell.position.set(SHELL_EXPLODE[0] * expT, SHELL_EXPLODE[1] * expT, SHELL_EXPLODE[2] * expT);

    spinQuat.setFromAxisAngle(AX_Yw, t * SPIN);
    engine.quaternion.copy(spinQuat);
    wobEuler.set(Math.sin(t * 0.27) * 0.07, 0, Math.sin(t * 0.19) * 0.05);
    wobQuat.setFromEuler(wobEuler);
    pivot.quaternion.copy(userQuat).multiply(wobQuat).multiply(isoQuat);

    // rotating assemblies — spools turn at their own rates, always
    const clock = now / 1000;
    // Spool-down is eased, not switched. A turbine losing drive coasts to a
    // stop over seconds — snapping to zero would read as a broken animation
    // rather than as a machine stopping.
    Object.keys(SYS).forEach(id => {
      const s = SYS[id];
      if (!s.spin) return;
      // Rotation keeps reporting status in the dismantled view too — that's
      // the view you inspect a failure in, so it's the one that most needs to
      // show which part has stopped and which is limping.
      const st = D[id] ? D[id].state : STATE.OK;
      const target = RATE[st];
      s.rate += (target - s.rate) * 0.018;
      s.angle += dt * s.spin * s.rate;
      s.group.rotation.x = s.angle;
    });

    // Alert pulse. Rim glow is always on at its base level, so an alerting
    // system brightens above the ambient x-ray glow rather than switching on.
    DEPTS.forEach(d => {
      const s = SYS[d.id];
      const alerting = d.state !== STATE.OK;
      const crit = d.state === STATE.CRIT;
      const pulse = 0.5 + 0.5 * Math.sin(clock * (crit ? 3.4 : 1.7));

      s.halos.forEach(h => {
        const base = h.userData.baseI || 0.5;
        h.material.uniforms.uI.value = alerting
          ? base * (1.9 + pulse * (crit ? 1.5 : 0.9))
          : base;
      });

      if (!alerting) {
        s.bodies.forEach(b => { if (b.material.emissive) b.material.emissiveIntensity = 0; });
        return;
      }
      const lvl = crit ? 0.22 + pulse * 0.20 : 0.14 + pulse * 0.12;
      s.bodies.forEach(b => { if (b.material.emissive) b.material.emissiveIntensity = lvl; });
    });

    // project labels
    pivot.updateMatrixWorld(true);
    DEPTS.forEach((d, i) => {
      const off = EXPLODE[d.id] || [0,0,0];
      wp.set(d.anchor[0] + off[0] * expT,
             d.anchor[1] + off[1] * expT,
             d.anchor[2] + off[2] * expT);
      engine.localToWorld(wp);
      const depth = wp.clone().normalize().z;
      wp.project(camera);
      const el = spotEls[i];
      el.style.left = ((wp.x * 0.5 + 0.5) * innerWidth) + 'px';
      el.style.top  = ((-wp.y * 0.5 + 0.5) * innerHeight) + 'px';
      const vis = THREE.MathUtils.smoothstep(depth, -0.7, 0.05);
      el.style.opacity = 0.30 + vis * 0.70;      // never fully hidden behind the core
      el.style.pointerEvents = vis > 0.25 ? 'auto' : 'none';
    });

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.fov = innerWidth < 700 ? 48 : 34;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  dispatchEvent(new Event('resize'));
})();
</script>
</body>
</html>
